name: learning-orbit

services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: learning_orbit
      POSTGRES_USER: learning_orbit
      POSTGRES_PASSWORD: ${LO_POSTGRES_PASSWORD:?LO_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    volumes:
      - learning_orbit_postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  # Private object store for media. Nothing here is ever public: the bucket is
  # created with no anonymous policy, and every browser read or write goes
  # through a short-lived presigned URL the server issues.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":59001"
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:59001"
    environment:
      MINIO_ROOT_USER: ${LO_STORAGE_ACCESS_KEY_ID:?LO_STORAGE_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${LO_STORAGE_SECRET_ACCESS_KEY:?LO_STORAGE_SECRET_ACCESS_KEY is required}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    volumes:
      - learning_orbit_minio_data:/data

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    ports:
      - "127.0.0.1:53310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    volumes:
      - learning_orbit_clamav_db:/var/lib/clamav

volumes:
  learning_orbit_postgres_data:
  learning_orbit_minio_data:
  learning_orbit_clamav_db:
