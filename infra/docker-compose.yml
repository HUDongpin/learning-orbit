name: learning-orbit

services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: learning_orbit
      POSTGRES_USER: learning_orbit
      POSTGRES_PASSWORD: ${LO_POSTGRES_PASSWORD:?LO_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    volumes:
      - learning_orbit_postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

volumes:
  learning_orbit_postgres_data:
