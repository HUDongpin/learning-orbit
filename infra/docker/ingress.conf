# Same-origin production ingress.
#
# The browser must see exactly one origin. Cookies are same-site and
# host-only, the CSP has no cross-origin connect-src, and the server refuses
# any Origin header that is not the configured one — none of which survives
# serving the app and the API from two hosts. So the ingress terminates TLS
# once and routes by path: /v1 to the API, everything else to the web app.
#
# The rule that matters most is the one that serves nothing: /internal is
# returned 404 here, unconditionally and before any proxy_pass. Those routes
# authenticate with a signed service assertion and no browser Origin, which is
# correct for a worker on the private network and would be a hole the moment
# the public ingress could reach them. Defence in depth: the server also
# refuses an internal request that carries any Origin at all.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream learning_orbit_api { server server:3001; keepalive 16; }
upstream learning_orbit_web { server web:3000;  keepalive 16; }

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/learning-orbit/tls/fullchain.pem;
  ssl_certificate_key /etc/learning-orbit/tls/privkey.pem;
  ssl_protocols TLSv1.3;
  ssl_session_timeout 10m;

  # A classroom message with four attachments is small; anything larger is not
  # a message this system accepts.
  client_max_body_size 8m;
  client_body_timeout 30s;

  # The upstreams set their own security headers. The ingress adds only what
  # it alone can promise, and does not override what the app decided.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  server_tokens off;

  # Internal service routes are not part of the public surface.
  location ^~ /internal/ { return 404; }
  location = /internal    { return 404; }

  # Fault-control routes exist only when LEARNING_ORBIT_TEST_FAULTS=1, and a
  # production server refuses to start with that variable set. The ingress
  # refuses them anyway: two independent answers to "can the public pause the
  # outbox" is the right number.
  location ^~ /test/ { return 404; }

  location ^~ /v1/ {
    proxy_pass http://learning_orbit_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A client-supplied assertion header would let a browser impersonate the
    # worker; it is stripped here rather than trusted and checked later.
    proxy_set_header X-LO-Service-Assertion "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # A 45-minute room holds one WebSocket for its whole life.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://learning_orbit_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
  }
}

server {
  listen 80;
  server_name _;
  return 308 https://$host$request_uri;
}
